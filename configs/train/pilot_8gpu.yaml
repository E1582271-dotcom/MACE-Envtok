# Short runs for the 8-GPU pilot (scaling, equivalence); out_dir/max_steps are set per run.
train_file: ${ENVTOK_DATA}/envtok_train.h5
val_file: ${ENVTOK_DATA}/omat24_val_10pct.h5
out_dir: ${ENVTOK_SCRATCH}/runs/pilot
run_name: pilot
device: cuda
dtype: float32
num_workers: 8
batch_size: 128
global_batch: 1024
val_batch_size: 64
val_fraction: 0.05
max_epochs: 1
max_steps: 60
log_every: 10
use_wandb: false
model: {backend: cueq}
