[project]
name = "envtok-mace"
version = "0.9.0"
description = "From-scratch MACE interatomic potential with multi-node DDP training on the EnvTok subset of OMat24"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.7.1",
    "e3nn==0.4.4",
    "numpy",
    "scipy",
    "ase>=3.23",
    "matscipy",
    "h5py",
    "pyyaml",
    "ase-db-backends>=0.11.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Linux + CUDA only: fused tensor-product kernels
cueq = ["cuequivariance==0.8.1", "cuequivariance-torch==0.8.1", "cuequivariance-ops-torch-cu12==0.8.1; sys_platform == 'linux'"]
track = ["wandb"]
# MatCalc-Bench, pinned to the authors' benchmark environment so results are comparable.
# phonors must match phonopy: phonopy 4.1.0 calls an API that phonors 0.6 renamed,
# which makes every phonon calculation return NaN.
bench = [
    "matcalc==0.5.1",
    "matminer==0.10.1",
    "phonopy==4.1.0",
    "phono3py==4.1.0",
    "phonors==0.2.1",
    "pymatgen==2026.5.4",
    "pymatgen-core==2026.5.18",
    "monty==2026.5.18",
    "spglib==2.7.0",
    "symfc==1.7.2",
    "pandas==2.3.3",
    # MD stability (the arena's own MD task) and Li-migration NEB (dataset + metrics)
    "mlip-arena==0.2.0",
    "litraj==0.1",
    "pyarrow",
]

[project.urls]
Repository = "https://github.com/E1582271-dotcom/MACE-Envtok"
Paper = "https://arxiv.org/abs/2610.14392"

[project.scripts]
envtok-mace = "envtok_mace.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "scikit-learn",
    # reference implementation, used only as an oracle in parity tests
    "mace-torch==0.3.14",
    # pure-PyTorch fallback of the cuEquivariance backend, for the backend tests on CPU
    "cuequivariance==0.8.1",
    "cuequivariance-torch==0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envtok_mace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::FutureWarning:e3nn",
    "ignore:The TorchScript type system:UserWarning",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# zip() without strict= is used deliberately on equal-length sequences throughout
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["envtok_mace"]
